[package]
name = "picfug"
version = "0.1.0"
edition = "2021"
description = "图片文件自动转换 CLI 守护进程"
license = "MIT"

[[bin]]
name = "picfug"
path = "src/main.rs"

[lib]
name = "picfug"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
# 配置解析
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# 文件监听 + 遍历
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }
# 图像处理
image = "0.25"
# 异步运行时
tokio = { version = "1", features = ["full"] }
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# 错误处理
anyhow = "1"
thiserror = "1"
# 工具
once_cell = "1"
humantime = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
